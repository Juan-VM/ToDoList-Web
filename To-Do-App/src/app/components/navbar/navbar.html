<header class="sticky top-0 z-40 border-b border-slate-200 bg-white shadow-sm">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">

        <a href="#" class="flex items-center gap-2 text-xl font-bold tracking-tight text-indigo-700">
            <span class="material-symbols-outlined">task_alt</span>
            TaskFlow
        </a>

        <nav class="hidden items-center gap-8 md:flex">
            <a href="#" class="border-b-2 border-indigo-600 py-5 text-sm font-semibold text-indigo-700">
                Mis tareas
            </a>
        </nav>

        <div class="flex items-center gap-3">
            <a href="#nueva-tarea"
                class="hidden items-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-700 sm:inline-flex">
                <span class="material-symbols-outlined text-lg">add</span>
                Nueva tarea
            </a>

            <div class="relative">
                <button type="button" (click)="toggleMenu()"
                    class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-200 bg-slate-100 text-slate-600 hover:border-indigo-400"
                    aria-label="Abrir menú de usuario">
                    <span class="material-symbols-outlined">account_circle</span>
                </button>

                @if (menuOpen) {
                <div class="absolute right-0 mt-2 w-48 rounded-xl border border-slate-200 bg-white py-2 shadow-lg">
                    <a href="#perfil" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">
                        Mi perfil
                    </a>
                    <a href="#configuracion" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">
                        Configuración
                    </a>
                </div>
                }
            </div>
        </div>
    </div>
</header>
